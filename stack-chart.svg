<svg width="340" height="190" viewBox="0 0 340 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Efekt delikatnej poświaty (Glow Effect) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtelny cień pod ramką -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes spin-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .main-ring {
      transform-origin: 95px 95px;
      animation: spin-cw 28s linear infinite;
    }
    .orbit-ring {
      transform-origin: 95px 95px;
      animation: spin-ccw 18s linear infinite;
    }
    .core-pulse {
      animation: pulse-subtle 3s ease-in-out infinite;
    }

    .legend-text {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 11px;
      fill: #cbd5e1;
      font-weight: 500;
    }
    .legend-val {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 10px;
      fill: #38bdf8;
      font-weight: 600;
      animation: pulse-subtle 4s ease-in-out infinite;
    }
  </style>

  <!-- Granatowa Ramka / Kontener (#0f172a z precyzyjnym obrysem) -->
  <rect x="2" y="2" width="336" height="186" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Zewnętrzny, Przerywany Pierścień Orbitujący (Przeciwbieżny RADAR Orbit) -->
  <g class="orbit-ring">
    <circle cx="95" cy="95" r="64" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 16" opacity="0.35" />
    <circle cx="95" cy="95" r="64" fill="none" stroke="#cea75d" stroke-width="1.5" stroke-dasharray="2 30" opacity="0.6" />
  </g>

  <!-- Główny Animowany Wykres Pierścieniowy (Clockwise Stack Rotation) -->
  <g class="main-ring" filter="url(#glow)">
    <!-- Rust (35%) -> Gold #CEA75D -->
    <circle cx="95" cy="95" r="50" fill="none" stroke="#CEA75D" stroke-width="10" stroke-dasharray="110 204" stroke-dashoffset="0" />
    <!-- C++23 (25%) -> Blue #00599C -->
    <circle cx="95" cy="95" r="50" fill="none" stroke="#00599C" stroke-width="10" stroke-dasharray="78 236" stroke-dashoffset="-114" />
    <!-- eBPF (15%) -> Bright Blue #1D63ED -->
    <circle cx="95" cy="95" r="50" fill="none" stroke="#1D63ED" stroke-width="10" stroke-dasharray="47 267" stroke-dashoffset="-196" />
    <!-- Ada/SPARK (15%) -> Cyan #38BDF8 -->
    <circle cx="95" cy="95" r="50" fill="none" stroke="#38BDF8" stroke-width="10" stroke-dasharray="47 267" stroke-dashoffset="-247" />
    <!-- VHDL (10%) -> Purple #5C2D91 -->
    <circle cx="95" cy="95" r="50" fill="none" stroke="#5C2D91" stroke-width="10" stroke-dasharray="31 283" stroke-dashoffset="-298" />
  </g>

  <!-- Wewnętrzny Rdzeń z Pulsującym Wskaźnikiem (Inner Core System) -->
  <circle cx="95" cy="95" r="39" fill="#0f172a" />
  <circle cx="95" cy="95" r="38" fill="none" stroke="#1e293b" stroke-width="1" />

  <g class="core-pulse">
    <text x="95" y="91" text-anchor="middle" font-family="&#39;Fira Code&#39;, monospace" font-size="8" fill="#64748b" letter-spacing="1">SYSTEM</text>
    <text x="95" y="103" text-anchor="middle" font-family="&#39;Fira Code&#39;, monospace" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="0.5">CORE</text>
  </g>

  <!-- Wygląd Legendy Stacku (Tech UI Alignment) -->
  <g transform="translate(180, 37)">
    <!-- Rust -->
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#CEA75D" />
    <text x="16" y="8" class="legend-text">Rust</text>
    <text x="135" y="8" text-anchor="end" class="legend-val">35%</text>

    <!-- C++23 -->
    <rect x="0" y="24" width="8" height="8" rx="2" fill="#00599C" />
    <text x="16" y="32" class="legend-text">C++23</text>
    <text x="135" y="32" text-anchor="end" class="legend-val">25%</text>

    <!-- eBPF -->
    <rect x="0" y="48" width="8" height="8" rx="2" fill="#1D63ED" />
    <text x="16" y="56" class="legend-text">eBPF</text>
    <text x="135" y="56" text-anchor="end" class="legend-val">15%</text>

    <!-- Ada/SPARK -->
    <rect x="0" y="72" width="8" height="8" rx="2" fill="#38BDF8" />
    <text x="16" y="80" class="legend-text">Ada/SPARK</text>
    <text x="135" y="80" text-anchor="end" class="legend-val">15%</text>

    <!-- VHDL -->
    <rect x="0" y="96" width="8" height="8" rx="2" fill="#5C2D91" />
    <text x="16" y="104" class="legend-text">VHDL</text>
    <text x="135" y="104" text-anchor="end" class="legend-val">10%</text>
  </g>
</svg>