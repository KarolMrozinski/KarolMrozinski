<svg width="340" height="230" viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes spin-node {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .node-spin-1 { transform-origin: 16px 17px; animation: spin-node 8s linear infinite; }
    .node-spin-2 { transform-origin: 16px 17px; animation: spin-node 10s linear infinite; }
    .node-spin-3 { transform-origin: 16px 17px; animation: spin-node 7s linear infinite; }
    .node-spin-4 { transform-origin: 16px 17px; animation: spin-node 9s linear infinite; }
    
    .accent-pulse { animation: pulse-subtle 3s ease-in-out infinite; }

    .bio-title {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .bio-sub {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 9.5px;
      fill: #94a3b8;
    }
    .label-title {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 10px;
      font-weight: 700;
    }
    .label-val {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 9.5px;
      fill: #94a3b8;
    }
  </style>

  <!-- Kontener Kafelka (#0f172a z dopasowanym obrysem) -->
  <rect x="2" y="2" width="336" height="226" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

  <!-- Górna Sekcja Bio -->
  <g transform="translate(14, 16)">
    <rect x="0" y="0" width="3.5" height="34" rx="1.75" fill="#38bdf8" class="accent-pulse" />
    <text x="12" y="12" class="bio-title">Software Engineer & Security Analyst</text>
    <text x="12" y="27" class="bio-sub">Low-Level Systems • CTI • Zero-Trust Architecture</text>
  </g>

  <!-- Linia podziału sekcji -->
  <line x1="14" y1="58" x2="326" y2="58" stroke="#1e293b" stroke-width="1" />

  <!-- SEKCJE KOMPETENCJI (z czystą rotacją 360° bezpieczną dla sanitizera) -->
  <g transform="translate(14, 66)">
    
    <!-- Kafelek 1: CORE DOMAINS -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="312" height="34" rx="6" fill="#161e2e" stroke="#1e293b" stroke-width="1" />
      <g class="node-spin-1">
        <rect x="11" y="12" width="10" height="10" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="16" cy="17" r="2" fill="#38bdf8" />
      </g>
      <text x="30" y="14" class="label-title" fill="#38bdf8">CORE DOMAINS</text>
      <text x="30" y="26" class="label-val">Purple Team • CTI Telemetry • eBPF</text>
    </g>

    <!-- Kafelek 2: PHILOSOPHY -->
    <g transform="translate(0, 39)">
      <rect x="0" y="0" width="312" height="34" rx="6" fill="#161e2e" stroke="#1e293b" stroke-width="1" />
      <g class="node-spin-2">
        <rect x="11" y="12" width="10" height="10" rx="2" fill="none" stroke="#cea75d" stroke-width="1.5" />
        <circle cx="16" cy="17" r="2" fill="#cea75d" />
      </g>
      <text x="30" y="14" class="label-title" fill="#cea75d">PHILOSOPHY</text>
      <text x="30" y="26" class="label-val">High Assurance • Zero-Trust • Local-First</text>
    </g>

    <!-- Kafelek 3: ACADEMIC TRACK -->
    <g transform="translate(0, 78)">
      <rect x="0" y="0" width="312" height="34" rx="6" fill="#161e2e" stroke="#1e293b" stroke-width="1" />
      <g class="node-spin-3">
        <rect x="11" y="12" width="10" height="10" rx="2" fill="none" stroke="#10b981" stroke-width="1.5" />
        <circle cx="16" cy="17" r="2" fill="#10b981" />
      </g>
      <text x="30" y="14" class="label-title" fill="#10b981">ACADEMIC TRACK</text>
      <text x="30" y="26" class="label-val">Double Degree: Software Eng & Internal Sec</text>
    </g>

    <!-- Kafelek 4: DISTINCTIONS -->
    <g transform="translate(0, 117)">
      <rect x="0" y="0" width="312" height="34" rx="6" fill="#161e2e" stroke="#1e293b" stroke-width="1" />
      <g class="node-spin-4">
        <rect x="11" y="12" width="10" height="10" rx="2" fill="none" stroke="#1d63ed" stroke-width="1.5" />
        <circle cx="16" cy="17" r="2" fill="#1d63ed" />
      </g>
      <text x="30" y="14" class="label-title" fill="#1d63ed">DISTINCTIONS</text>
      <text x="30" y="26" class="label-val">NASA Space Apps • NASK • CISPA Champs</text>
    </g>

  </g>
</svg>